output * bg #222222 solid_color

input type:touchpad {
	tap enabled
	scroll_method two_finger
	natural_scroll enabled
}
seat * hide_cursor 8000

exec swayidle -w \
	timeout 60 'dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.LockIfBattery' \
	timeout 600 'dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Lock'

mode screen_off bindgesture --exact swipe:3:down output - power on; \
	seat - idle_inhibit keyboard pointer touchpad tablet_pad touch tablet_tool switch

bindswitch lid:on output - disable
bindswitch lid:off output * enable

include ~/.config/ushell/screens

# when the state of a window changes:
# if the focused window is tiling, kill all floating windows of current workspace
# 	then if it's not the first window of workspace, make it floating
# if the focused window is floating, open a dimmer
# if workspace is empty, open the launcher
exec '{ swaymsg -m -t subscribe "[\"window\"]" || swaynag -m "floater failed"; } | while read _; do \
	if swaymsg "[con_id=__focused__ tiling] focus"; then \
		swaymsg "[workspace=__focused__ floating] kill"; \
		swaymsg focus prev && swaymsg "focus next; floating enable"; \
	elif swaymsg "[con_id=__focused__ floating] focus"; then \
		dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Dim; \
	else \
		dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Launcher; \
	fi; \
done'

no_focus [app_id="ushell.SwayShell" title=dim]
for_window [app_id="ushell.SwayShell" title=dim] opacity 0.5, floating enable, resize grow 100ppt

bindsym --release Super_L "dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Launcher"
bindsym --release Super_R "dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Launcher"
bindsym Mod1+Tab "dbus-send --dest=ushell.SwayShell /ushell/SwayShell ushell.SwayShell.Launcher"

bindsym Mod4+BackSpace kill
bindsym Mod1+Escape kill

exec 'python3 "${USHELL_DIR}"/swayshell.py'
